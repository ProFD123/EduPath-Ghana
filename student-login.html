<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EduPath Ghana</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .account-container {
            width: 100%;
            max-width: 430px;
        }

        .account-card {
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            color: #0b5ed7;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 13px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #777;
        }

        .tab.active {
            color: #0b5ed7;
            border-bottom: 3px solid #0b5ed7;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0b5ed7;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #094db1;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e8f7ee;
            color: #18733c;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #b42318;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0b5ed7;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="account-container">

        <div class="account-card">

            <div class="logo">
                <h1>EduPath Ghana</h1>
            </div>

            <p class="subtitle">
                Find your path. Shape your future.
            </p>


            <!-- TABS -->

            <div class="tabs">

                <button
                    class="tab active"
                    id="loginTab"
                    onclick="showForm('login')">
                    Login
                </button>

                <button
                    class="tab"
                    id="registerTab"
                    onclick="showForm('register')">
                    Create Account
                </button>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                class="form active">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="loginButton">

                    Login

                </button>

            </form>


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                class="form">

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="registerButton">

                    Create Account

                </button>

            </form>


            <a
                href="index.html"
                class="back-link">
                ← Back to EduPath Ghana
            </a>

        </div>

    </div>


    <script>

        // ==========================================
        // FORM SWITCHING
        // ==========================================

        function showForm(formName) {

            const loginForm =
                document.getElementById("loginForm");

            const registerForm =
                document.getElementById("registerForm");

            const loginTab =
                document.getElementById("loginTab");

            const registerTab =
                document.getElementById("registerTab");

            clearMessage();

            if (formName === "login") {

                loginForm.classList.add("active");
                registerForm.classList.remove("active");

                loginTab.classList.add("active");
                registerTab.classList.remove("active");

            } else {

                registerForm.classList.add("active");
                loginForm.classList.remove("active");

                registerTab.classList.add("active");
                loginTab.classList.remove("active");

            }
        }


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(message, type) {

            const messageBox =
                document.getElementById("message");

            messageBox.textContent = message;

            messageBox.className =
                "message " + type;

        }


        function clearMessage() {

            const messageBox =
                document.getElementById("message");

            messageBox.textContent = "";

            messageBox.className = "message";

        }


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                const button =
                    document.getElementById("loginButton");

                button.textContent = "Logging in...";
                this.classList.add("loading");

                clearMessage();

                try {

                    const response =
                        await fetch("https://edupath-ghana-backend.onrender.com/api/users/login", { 

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok || !data.success) {

                        throw new Error(
                            data.message ||
                            "Login failed."
                        );

                    }


                    // Save logged-in user

                    localStorage.setItem(
                        "edupathUser",
                        JSON.stringify(data.user)
                    );


                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 800);


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    button.textContent = "Login";
                    this.classList.remove("loading");

                }

            });


        // ==========================================
        // REGISTER
        // ==========================================

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("registerPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;

                const button =
                    document.getElementById(
                        "registerButton"
                    );


                clearMessage();


                // Check password match

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;
                }


                button.textContent =
                    "Creating Account...";

                this.classList.add("loading");


                try {

                    const response =
                        await fetch(
                            "https://edupath-ghana-backend.onrender.com/api/users/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name,
                                    email,
                                    password
                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Could not create account."
                        );

                    }


                    // Save new user

                    localStorage.setItem(
                        "edupathUser",
                        JSON.stringify(data.user)
                    );


                    showMessage(
                        "Account created successfully! Redirecting...",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 800);


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    button.textContent =
                        "Create Account";

                    this.classList.remove("loading");

                }

            });

    </script>

</body>

</html>
